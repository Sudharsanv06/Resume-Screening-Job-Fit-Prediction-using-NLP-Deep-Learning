version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s  # give models time to load before first check

  # ── React Frontend ───────────────────────────────────────────────────────────
  # Uses the Node image directly — no separate Dockerfile needed for dev mode.
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules          # anonymous volume prevents host node_modules overwriting
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      # Browser makes the API call, so this must be localhost (not service name)
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: resume-screener-network
